<!doctype html><meta charset="utf-8"><title>Short Shifter finite animation</title>
<style>body{font:16px system-ui;padding:30px;background:#eee}ytd-compact-video-renderer{display:block;position:relative;width:350px;height:200px;min-height:160px;padding:10px;margin:15px;border:2px solid #333;box-sizing:border-box;background:#cdf}#ordinary{background:#cfc}pre{white-space:pre-wrap}button{padding:10px}</style>
<h1>Three bounces → collapse → wink → disappear</h1><button id="replay">Replay</button><pre id="results">Running…</pre>
<ytd-compact-video-renderer id="short"><a href="/shorts/demo">Illustrative Short</a></ytd-compact-video-renderer>
<ytd-compact-video-renderer id="ordinary"><a href="/watch?v=ordinary">Ordinary recommendation stays visible</a></ytd-compact-video-renderer>
<script>const listeners={};window.chrome={storage:{local:{get:async()=>({shortsVisible:false})},onChanged:{addListener:f=>listeners.storage=f}},runtime:{onMessage:{addListener:f=>listeners.message=f}}};document.getElementById('replay').onclick=()=>location.reload();</script>
<script src="../extension/detection.js"></script><script src="../extension/motion.js"></script><script src="../extension/content.js"></script>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const out=document.getElementById('results');const short=document.getElementById('short');const originalStyle=short.getAttribute('style');let failures=0;const results=[];
function check(name,ok){results.push(`${ok?'PASS':'FAIL'} ${name}`);if(!ok)failures++;out.textContent=results.join('\n');}
(async()=>{
 await sleep(120);let mascot=document.querySelector('.short-shifter-mascot');const bounce=mascot?.querySelector('.short-shifter-poo').getAnimations()[0];
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(!reduced){
 check('exactly three finite 500ms bounces',bounce?.effect.getTiming().iterations===3&&bounce.effect.getTiming().duration===500);
 check('no wink during bounce',getComputedStyle(mascot.querySelector('.short-shifter-face')).opacity==='0');
 await bounce.finished; await sleep(120);check('collapse follows third bounce',mascot.dataset.phase==='collapse');
 const midHeight=short.getBoundingClientRect().height;check('height reduces smoothly between endpoints',midHeight>0&&midHeight<200);
 await new Promise(requestAnimationFrame);const a=short.getBoundingClientRect(),b=mascot.getBoundingClientRect();check('mascot remains centred while shrinking',Math.abs((a.left+a.width/2)-(b.left+b.width/2))<2&&Math.abs((a.top+a.height/2)-(b.top+b.height/2))<8);
 const collapse=short.getAnimations()[0]; await collapse.finished; await sleep(100);check('wink comes after height reaches zero',mascot.dataset.phase==='wink'&&short.getBoundingClientRect().height<1);
 check('wink is visible',Number(getComputedStyle(mascot.querySelector('.short-shifter-face')).opacity)>.5);
 const wink=mascot.querySelector('.short-shifter-face').getAnimations()[0];await wink.finished; const fade=mascot.getAnimations()[0];if(fade)await fade.finished;for(let i=0;i<20&&mascot.isConnected;i++)await sleep(30);
 }
 check('Short finishes at zero height',short.getBoundingClientRect().height===0);
 check('poo disappears',document.querySelectorAll('.short-shifter-mascot').length===0);
 check('ordinary recommendation unchanged',document.getElementById('ordinary').getBoundingClientRect().height===200);
 await sleep(250);check('rescan does not replay hidden Short',document.querySelectorAll('.short-shifter-mascot').length===0);
 listeners.message({type:'SHORTS_VISIBILITY_CHANGED',shortsVisible:true});await sleep(80);
 check('toggle restores original height',short.getBoundingClientRect().height===200);
 check('toggle restores inline styles and inert state',short.style.length===0&&!short.inert);
 listeners.message({type:'SHORTS_VISIBILITY_CHANGED',shortsVisible:false});await sleep(120);
 listeners.message({type:'SHORTS_VISIBILITY_CHANGED',shortsVisible:true});await sleep(300);
 check('interrupted bounce restores immediately without late collapse',short.getBoundingClientRect().height===200&&document.querySelectorAll('.short-shifter-mascot').length===0);
 if(!reduced){
 listeners.message({type:'SHORTS_VISIBILITY_CHANGED',shortsVisible:false});await sleep(1750);
 listeners.message({type:'SHORTS_VISIBILITY_CHANGED',shortsVisible:true});await sleep(1000);
 check('interrupted collapse restores without late disappearance',short.getBoundingClientRect().height===200&&short.style.length===0);
 }
 out.textContent+=`\n\n${results.length-failures}/${results.length} passed (${reduced?'reduced motion':'normal motion'})`;
})();
</script>
